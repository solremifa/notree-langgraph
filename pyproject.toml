[project]
name = "notree-langgraph"
version = "0.1.0"
description = "Notree 과목 노트 업데이트 흐름을 LangGraph + 내부 MCP + Redis Streams worker로 돌려 보는 PoC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",  # run.py --saver sqlite 비교용
    "mcp[cli]>=1.10,<2",                  # 내부 MCP 서버/클라이언트 (A안), mcp dev
    "redis>=5",                           # worker·scheduler의 Redis Streams 클라이언트
    "fakeredis>=2.20",                    # demo.py에서 Redis 없이 돌릴 때
    "openai>=1.40",                       # --llm openai
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false            # 스크립트 모음이라 패키지로 설치하지 않음

[tool.pytest.ini_options]
testpaths = ["tests"]
